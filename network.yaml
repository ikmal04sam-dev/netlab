# network.yaml: your routed network, as data. A starting point to change into your own design.
#
#   python3 build_routed.py network.yaml      checks it, then builds it in Mininet
#   python3 make_page3.py network.yaml        checks it, then writes docs/week3/index.html
#
# Replace"1761 and every 61 (see "Your addresses"). Don't put your full student ID here.
#
# Each LAN has one router (.1 on the LAN) and one host (.10).
# On each link, the first router named is .1 and the second is .2.
# This starting point is the lab's network without r3. It works, but it doesn't meet the
# assignment's requirements: that's your job.

student_id_last4: "1761"

routers: [r1, r2, r3, r4]

lans:
  - name: lan-h1
    network: 10.61.1.0/24
    router: r1
    host: h1
  - name: lan-h2
    network: 10.61.32.0/24
    router: r2
    host: h2
  - name: lan-h3
    network: 10.61.33.0/24
    router: r3
    host: h3
  - name: lan-h4
    network: 10.61.34.0/24
    router: r4
    host: h4

links:
  - [r1, r2, 10.61.12.0/30]
  - [r2, r3, 10.61.23.0/30]
  - [r3, r4, 10.61.43.0/30]
  - [r4, r1, 10.61.14.0/30]

routes:
  r1:
    - to: 10.61.32.0/20
      via: 10.61.12.2
    - to: 10.61.34.0/24
      via: 10.61.14.1 # FIXED: r4 is .1 on the r4-r1 link

  r2:
    - to: 10.61.1.0/24
      via: 10.61.12.1
    - to: 10.61.33.0/24
      via: 10.61.23.2
    - to: 10.61.34.0/24
      via: 10.61.23.2

  r3:
    - to: 10.61.1.0/24
      via: 10.61.23.1
    - to: 10.61.32.0/24
      via: 10.61.23.1
    - to: 10.61.34.0/24
      via: 10.61.43.2

  r4:
    - to: 10.61.1.0/24
      via: 10.61.14.2 # FIXED: r1 is .2 on the r4-r1 link
    - to: 10.61.32.0/20
      via: 10.61.43.1
