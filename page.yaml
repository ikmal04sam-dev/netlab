# page.yaml: the words on your page, kept as data like everything else.
# make_page.py puts each answer under its question. A few sentences each, in your own words;
# leave a blank line between paragraphs. Refer to YOUR network and YOUR evidence.
# Never put your name or full student ID here: the page is public.

repository: https://github.com/ikmal04sam-dev/netlab

answers:
  planes:
    question: "Where are the data, control and management planes in your network?"
    answer: "The data plane is inside the Linux kernel on the bridges (s1, s2, s3) forwarding network frames. The control plane runs standard bridge learning algorithms inside the kernel to build forwarding tables. The management plane consists of build_topo.py, make_page.py, and Mininet, which build and test the network."

  learning:
    question: "How did your switches learn which port leads to each host? Use your MAC table evidence."
    answer: "Switches learned MAC locations automatically by inspecting incoming frames. As shown in macs.txt from 'brctl showmacs s1', when a host sends traffic, the switch records its source MAC address alongside the port it arrived on."

  kind:
    question: "Which of the four kinds of programmability is this assignment (a network described as data, then built and documented by scripts)? Why isn't it any of the other three?"
    answer: "This is Declarative / Data-driven Automation because the topology is defined in a data file (topology.yaml) and built by scripts. It isn't On-box Scripting because scripts run externally; it isn't Device APIs because it doesn't query NETCONF/RESTCONF; and it isn't Control Plane SDN because it doesn't use an external controller like OpenFlow."

  two_am:
    question: "Week 1's 2 a.m. change on 40 switches: what would be different if those switches were described like your network?"
    answer: "Instead of manually typing CLI commands on 40 individual switches, you would edit one central YAML file in Git. Automated scripts would validate the changes with check() and deploy them across all switches at once, allowing easy rollbacks if needed."

  model:
    question: "What's the difference between your network's data model and its serialisation? Use YAML and JSON as the example."
    answer: "The data model is the logical structure representing devices and links. Serialization is how that structure is written down in text. YAML and JSON hold the exact same data model, but YAML uses clean indentation while JSON uses brackets and braces."

  check:
    question: "Why is it better to catch bad data in check() than with pingall? What did IPv6 notice about a duplicate address that IPv4 didn't?"
    answer: "check() catches errors before building the network, preventing unexpected behavior in production. pingall only tests basic connectivity after startup. IPv6 automatically flagged duplicate IPs as 'dadfailed' using Duplicate Address Detection (DAD), whereas IPv4 silently accepted duplicate IPs and broke traffic routing without an explicit error."

  git:
    question: "What does your Git history give you that copying files into folders named topology-v2-final wouldn't?"
    answer: "Git tracks exact line-by-line changes (git diff), records who made updates and when, and allows instant rollbacks with 'git revert'. Copying folders creates duplicate files, clutter, and no clear history of changes."
